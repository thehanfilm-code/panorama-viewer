<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>360° 파노라마 뷰어</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0a0a;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
    color: #fff;
    overflow: hidden;
  }
  #container {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }
  #drop-zone {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    padding: 48px 72px;
    border: 2px dashed rgba(255, 255, 255, 0.4);
    border-radius: 16px;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(8px);
    text-align: center;
    cursor: pointer;
    transition: all 0.2s ease;
    z-index: 10;
    min-width: 360px;
  }
  #drop-zone:hover,
  #drop-zone.drag-over {
    border-color: rgba(255, 255, 255, 0.9);
    background: rgba(255, 255, 255, 0.08);
    transform: translate(-50%, -50%) scale(1.02);
  }
  #drop-zone h1 {
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 12px;
    letter-spacing: -0.5px;
  }
  #drop-zone p {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.7);
    margin-bottom: 6px;
  }
  #drop-zone .hint {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.45);
    margin-top: 16px;
  }
  #drop-zone .icon {
    font-size: 48px;
    margin-bottom: 16px;
    opacity: 0.6;
  }
  #controls {
    position: absolute;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    display: none;
    gap: 8px;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(12px);
    padding: 8px;
    border-radius: 10px;
    z-index: 10;
  }
  #controls.visible { display: flex; }
  .btn {
    padding: 10px 18px;
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  .btn:hover {
    background: rgba(255, 255, 255, 0.18);
    border-color: rgba(255, 255, 255, 0.3);
  }
  .btn:active { transform: scale(0.97); }
  #file-input { display: none; }
  #info {
    position: absolute;
    top: 20px; left: 20px;
    padding: 10px 14px;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(8px);
    border-radius: 8px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.7);
    display: none;
    z-index: 10;
    line-height: 1.6;
  }
  #info.visible { display: block; }
  #height-control {
    position: absolute;
    top: 50%; right: 24px;
    transform: translateY(-50%);
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(12px);
    padding: 16px 12px;
    border-radius: 10px;
    z-index: 10;
  }
  #height-control.visible { display: flex; }
  #height-control .label {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.7);
    white-space: nowrap;
    writing-mode: vertical-rl;
    text-orientation: mixed;
  }
  #height-slider {
    -webkit-appearance: slider-vertical;
    appearance: slider-vertical;
    writing-mode: vertical-lr;
    width: 8px;
    height: 200px;
    background: transparent;
    cursor: pointer;
  }
  #height-slider::-webkit-slider-runnable-track {
    width: 4px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 2px;
  }
  #height-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    background: #fff;
    border-radius: 50%;
    cursor: grab;
    margin-left: -7px;
  }
  #height-value {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.9);
    font-variant-numeric: tabular-nums;
    min-width: 32px;
    text-align: center;
  }
  #height-reset {
    padding: 4px 8px;
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 4px;
    cursor: pointer;
    font-size: 10px;
  }
  #height-reset:hover { background: rgba(255, 255, 255, 0.18); }
  #loading {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    padding: 20px 32px;
    background: rgba(0, 0, 0, 0.7);
    border-radius: 10px;
    font-size: 14px;
    display: none;
    z-index: 20;
  }
  #loading.visible { display: block; }
  /* 전자책 페이지 넘김 레이어 */
  #flip-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    pointer-events: none; /* 터치는 아래 캔버스로 통과 */
    perspective-origin: 0 50%;
    display: none;
    z-index: 5;
  }
  #flip-layer.visible { display: block; }
  #flip-page {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    transform-origin: 0 50%; /* 왼쪽 가장자리가 책등 */
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    will-change: transform;
  }
  #flip-canvas { width: 100%; height: 100%; cursor: default; }
  #flip-shade {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(to right, rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.6));
    opacity: 0;
  }
  #flip-shadow {
    position: absolute;
    top: 0; left: 0;
    width: 60px; height: 100%;
    background: linear-gradient(to right, rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0));
    opacity: 0;
  }
  #page-indicator {
    position: absolute;
    bottom: 92px; left: 50%;
    transform: translateX(-50%);
    padding: 6px 12px;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(8px);
    border-radius: 999px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.85);
    font-variant-numeric: tabular-nums;
    display: none;
    z-index: 10;
  }
  #page-indicator.visible { display: block; }
  canvas { display: block; cursor: grab; }
  canvas:active { cursor: grabbing; }
</style>
</head>
<body>
<div id="container"></div>

<div id="flip-layer">
  <div id="flip-shadow"></div>
  <div id="flip-page">
    <canvas id="flip-canvas"></canvas>
    <div id="flip-shade"></div>
  </div>
</div>

<div id="page-indicator"></div>

<div id="drop-zone">
  <div class="icon">🌐</div>
  <h1>360° 파노라마 뷰어</h1>
  <p>이미지를 드래그하거나 클릭해서 업로드</p>
  <p class="hint">Equirectangular (2:1 비율) 이미지 권장 · JPG, PNG<br>여러 장을 고르면 전자책처럼 넘겨볼 수 있어요</p>
</div>

<div id="info">
  드래그: 시점 회전 · 스크롤: 줌<br>
  슬라이더 / ↑↓ : 시점 높이
  <span id="info-flip"><br>가장자리 스와이프 / ←→ : 페이지 넘기기</span>
</div>

<div id="loading">이미지 로딩 중...</div>

<div id="height-control">
  <span class="label">시점 높이</span>
  <span id="height-value">0</span>
  <input type="range" id="height-slider" min="-200" max="200" value="0" step="1">
  <button id="height-reset">리셋</button>
</div>

<div id="controls">
  <label class="btn" for="file-input">다른 이미지</label>
  <button class="btn" id="reset-btn">시점 리셋</button>
  <button class="btn" id="fullscreen-btn">전체화면</button>
  <button class="btn" id="autorotate-btn">자동 회전</button>
</div>

<input type="file" id="file-input" accept="image/*" multiple>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
  let scene, camera, renderer, sphere;
  let isUserInteracting = false;
  let onPointerDownMouseX = 0, onPointerDownMouseY = 0;
  let lon = 0, onPointerDownLon = 0;
  let lat = 0, onPointerDownLat = 0;
  let phi = 0, theta = 0;
  let fov = 75;
  let autoRotate = false;
  let cameraHeight = 0; // 구 내부에서 카메라의 Y 위치 (-200 ~ +200)

  // 여러 장의 파노라마 (전자책 페이지)
  let images = [];      // { url, texture, promise }
  let currentIndex = 0;
  let flip = null;      // 진행 중인 페이지 넘김 { dir, target, angle }
  let swipe = null;     // 가장자리 스와이프 제스처 { mode, dir, startX, startY, lastX, lastT, vx }

  const container = document.getElementById('container');
  const dropZone = document.getElementById('drop-zone');
  const controls = document.getElementById('controls');
  const info = document.getElementById('info');
  const infoFlip = document.getElementById('info-flip');
  const loading = document.getElementById('loading');
  const fileInput = document.getElementById('file-input');
  const fullscreenBtn = document.getElementById('fullscreen-btn');
  const resetBtn = document.getElementById('reset-btn');
  const autoRotateBtn = document.getElementById('autorotate-btn');
  const heightControl = document.getElementById('height-control');
  const heightSlider = document.getElementById('height-slider');
  const heightValue = document.getElementById('height-value');
  const heightReset = document.getElementById('height-reset');
  const pageIndicator = document.getElementById('page-indicator');
  const flipLayer = document.getElementById('flip-layer');
  const flipPage = document.getElementById('flip-page');
  const flipCanvas = document.getElementById('flip-canvas');
  const flipShade = document.getElementById('flip-shade');
  const flipShadow = document.getElementById('flip-shadow');
  const flipCtx = flipCanvas.getContext('2d');

  function init() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(fov, window.innerWidth / window.innerHeight, 1, 1100);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    const geometry = new THREE.SphereGeometry(500, 60, 40);
    geometry.scale(-1, 1, 1); // 안쪽에서 보이도록 뒤집기

    const material = new THREE.MeshBasicMaterial({ color: 0x111111 });
    sphere = new THREE.Mesh(geometry, material);
    scene.add(sphere);

    // 마우스 이벤트
    const canvas = renderer.domElement;
    canvas.addEventListener('mousedown', onPointerDown);
    canvas.addEventListener('mousemove', onPointerMove);
    canvas.addEventListener('mouseup', onPointerUp);
    canvas.addEventListener('mouseleave', onPointerUp);
    canvas.addEventListener('wheel', onWheel, { passive: false });

    // 터치 이벤트
    canvas.addEventListener('touchstart', onTouchStart, { passive: false });
    canvas.addEventListener('touchmove', onTouchMove, { passive: false });
    canvas.addEventListener('touchend', onTouchEnd);
    canvas.addEventListener('touchcancel', onTouchEnd);

    window.addEventListener('resize', onWindowResize);

    animate();
  }

  function loadTexture(i) {
    const item = images[i];
    if (!item.promise) {
      item.promise = new Promise((resolve, reject) => {
        new THREE.TextureLoader().load(
          item.url,
          (texture) => {
            texture.minFilter = THREE.LinearFilter;
            // 로딩 중 이미지 목록이 바뀌었으면 버린다
            if (!images.includes(item)) {
              texture.dispose();
              reject(new Error('stale'));
              return;
            }
            item.texture = texture;
            resolve(texture);
          },
          undefined,
          (err) => {
            item.promise = null;
            reject(err);
          }
        );
      });
    }
    return item.promise;
  }

  // 현재 페이지 앞뒤 한 장씩만 GPU에 올려두고 나머지는 해제
  function preloadNeighbors() {
    images.forEach((item, i) => {
      if (Math.abs(i - currentIndex) > 1 && item.texture) {
        item.texture.dispose();
        item.texture = null;
        item.promise = null;
      }
    });
    [currentIndex - 1, currentIndex + 1].forEach((i) => {
      if (i >= 0 && i < images.length) loadTexture(i).catch(() => {});
    });
  }

  function setSphereTexture(texture) {
    sphere.material.map = texture;
    sphere.material.color.set(0xffffff);
    sphere.material.needsUpdate = true;
  }

  function updatePageIndicator() {
    const multi = images.length > 1;
    pageIndicator.classList.toggle('visible', multi);
    pageIndicator.textContent = (currentIndex + 1) + ' / ' + images.length;
    infoFlip.style.display = multi ? '' : 'none';
  }

  function handleFiles(fileList) {
    const files = Array.from(fileList).filter((f) => f.type.startsWith('image/'));
    if (!files.length) return;

    cancelFlip();
    images.forEach((item) => {
      if (item.texture) item.texture.dispose();
      URL.revokeObjectURL(item.url);
    });
    images = files.map((f) => ({ url: URL.createObjectURL(f), texture: null, promise: null }));
    currentIndex = 0;

    loading.classList.add('visible');
    loadTexture(0).then(
      (texture) => {
        setSphereTexture(texture);
        dropZone.style.display = 'none';
        controls.classList.add('visible');
        heightControl.classList.add('visible');
        updatePageIndicator();
        info.classList.add('visible');
        info.style.transition = '';
        info.style.opacity = '1';
        loading.classList.remove('visible');
        preloadNeighbors();
        // 뷰어 표시 후 힌트 3초 뒤 페이드
        setTimeout(() => {
          info.style.transition = 'opacity 1s ease';
          info.style.opacity = '0';
          setTimeout(() => info.classList.remove('visible'), 1000);
        }, 3000);
      },
      (err) => {
        if (err && err.message === 'stale') return;
        loading.classList.remove('visible');
        alert('이미지를 불러오지 못했습니다.');
        console.error(err);
      }
    );
  }

  // ---------- 전자책 페이지 넘김 ----------

  // 주어진 텍스처로 현재 시점을 렌더링해서 넘김용 종이(캔버스)에 복사
  function snapshot(texture) {
    const original = sphere.material.map;
    sphere.material.map = texture;
    updateCamera();
    renderer.render(scene, camera);
    const src = renderer.domElement;
    flipCanvas.width = src.width;
    flipCanvas.height = src.height;
    flipCtx.drawImage(src, 0, 0);
    sphere.material.map = original;
  }

  // dir: +1 다음 장, -1 이전 장. 대상 이미지가 아직 준비 안 됐으면 false
  function startFlip(dir) {
    const target = currentIndex + dir;
    if (flip || target < 0 || target >= images.length) return false;
    const targetTexture = images[target].texture;
    const currentTexture = images[currentIndex].texture;
    if (!targetTexture || !currentTexture) return false;

    if (dir > 0) {
      // 현재 장이 종이가 되어 왼쪽으로 넘어가고, 그 아래 다음 장이 드러남
      snapshot(currentTexture);
      setSphereTexture(targetTexture);
    } else {
      // 이전 장이 종이가 되어 왼쪽에서 다시 덮여 옴
      snapshot(targetTexture);
    }
    flip = { dir, target, angle: dir > 0 ? 0 : 90 };
    flipLayer.style.perspective = (window.innerWidth * 4) + 'px';
    flipLayer.classList.add('visible');
    renderFlip();
    return true;
  }

  // angle: 0 = 종이가 화면을 덮은 상태, 90 = 완전히 넘어간 상태
  function renderFlip() {
    const a = flip.angle;
    const rad = THREE.MathUtils.degToRad(a);
    const w = window.innerWidth;
    flipPage.style.transform = 'rotateY(' + (-a) + 'deg)';
    flipShade.style.opacity = (a / 90).toFixed(3);
    // 종이 끝이 화면에 투영되는 위치에 그림자를 드리운다
    const k = w / (w * 4);
    const edgeX = w * Math.cos(rad) / (1 - k * Math.sin(rad));
    flipShadow.style.transform = 'translateX(' + edgeX.toFixed(1) + 'px)';
    flipShadow.style.opacity = Math.sin(rad * 2).toFixed(3);
  }

  function settleFlip(commit) {
    const f = flip;
    const from = f.angle;
    const to = (commit === (f.dir > 0)) ? 90 : 0;
    const duration = 120 + 280 * Math.abs(to - from) / 90;
    const t0 = performance.now();
    f.settling = true;
    function step(now) {
      if (flip !== f) return;
      const t = Math.min(1, (now - t0) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      f.angle = from + (to - from) * eased;
      renderFlip();
      if (t < 1) requestAnimationFrame(step);
      else finishFlip(commit);
    }
    requestAnimationFrame(step);
  }

  function finishFlip(commit) {
    const { dir, target } = flip;
    if (commit) {
      currentIndex = target;
      if (dir < 0) setSphereTexture(images[target].texture);
      updatePageIndicator();
      preloadNeighbors();
    } else if (dir > 0) {
      setSphereTexture(images[currentIndex].texture);
    }
    flip = null;
    flipLayer.classList.remove('visible');
  }

  function cancelFlip() {
    if (flip && flip.dir > 0 && images[currentIndex] && images[currentIndex].texture) {
      setSphereTexture(images[currentIndex].texture);
    }
    flip = null;
    swipe = null;
    flipLayer.classList.remove('visible');
  }

  // 키보드 등에서 애니메이션과 함께 한 장 넘기기
  function flipBy(dir) {
    const target = currentIndex + dir;
    if (flip || target < 0 || target >= images.length) return;
    loadTexture(target).then(() => {
      if (currentIndex + dir === target && startFlip(dir)) settleFlip(true);
    }, () => {});
  }

  function edgeZoneWidth() {
    return Math.max(48, window.innerWidth * 0.15);
  }

  // ---------- 입력 ----------

  function onPointerDown(event) {
    isUserInteracting = true;
    onPointerDownMouseX = event.clientX;
    onPointerDownMouseY = event.clientY;
    onPointerDownLon = lon;
    onPointerDownLat = lat;
  }

  function onPointerMove(event) {
    if (!isUserInteracting) return;
    lon = (onPointerDownMouseX - event.clientX) * 0.2 + onPointerDownLon;
    lat = (event.clientY - onPointerDownMouseY) * 0.2 + onPointerDownLat;
  }

  function onPointerUp() {
    isUserInteracting = false;
  }

  function onTouchStart(event) {
    if (event.touches.length !== 1) return;
    event.preventDefault();
    if (flip) return; // 넘김 애니메이션 중에는 무시
    const t = event.touches[0];
    isUserInteracting = true;
    onPointerDownMouseX = t.clientX;
    onPointerDownMouseY = t.clientY;
    onPointerDownLon = lon;
    onPointerDownLat = lat;

    // 좌/우 가장자리에서 시작한 터치는 페이지 넘김 후보
    swipe = null;
    const edge = edgeZoneWidth();
    let dir = 0;
    if (t.clientX > window.innerWidth - edge && currentIndex < images.length - 1) dir = 1;
    else if (t.clientX < edge && currentIndex > 0) dir = -1;
    if (dir) {
      swipe = {
        mode: 'pending', dir,
        startX: t.clientX, startY: t.clientY,
        lastX: t.clientX, lastT: performance.now(), vx: 0
      };
    }
  }

  function onTouchMove(event) {
    if (event.touches.length !== 1) return;
    event.preventDefault();
    const x = event.touches[0].clientX;
    const y = event.touches[0].clientY;

    if (swipe && swipe.mode === 'pending') {
      const dx = x - swipe.startX, dy = y - swipe.startY;
      if (Math.hypot(dx, dy) < 10) return;
      // 책 안쪽 방향으로의 가로 스와이프면 넘김, 아니면 평소처럼 회전
      if (Math.abs(dx) > Math.abs(dy) && Math.sign(dx) === -swipe.dir && startFlip(swipe.dir)) {
        swipe.mode = 'flip';
        isUserInteracting = false;
      } else {
        swipe = null;
      }
    }

    if (swipe && swipe.mode === 'flip') {
      const now = performance.now();
      const dt = now - swipe.lastT;
      if (dt > 0) swipe.vx = 0.6 * ((x - swipe.lastX) / dt) + 0.4 * swipe.vx;
      swipe.lastX = x;
      swipe.lastT = now;

      // 손가락 위치에 맞춰 종이를 들어 올린다 (1 = 펼친 상태, 0 = 넘어간 상태)
      const w = window.innerWidth;
      let c = swipe.dir > 0
        ? x / swipe.startX
        : (x - swipe.startX) / (w - swipe.startX);
      c = Math.max(0, Math.min(1, c));
      flip.angle = THREE.MathUtils.radToDeg(Math.acos(c));
      renderFlip();
      return;
    }

    if (isUserInteracting) {
      lon = (onPointerDownMouseX - x) * 0.2 + onPointerDownLon;
      lat = (y - onPointerDownMouseY) * 0.2 + onPointerDownLat;
    }
  }

  function onTouchEnd(event) {
    if (swipe && swipe.mode === 'flip' && flip && !flip.settling) {
      // 넘김 방향 속도 (px/ms). 빠르게 튕기면 덜 끌었어도 넘어간다
      // (손가락을 멈췄다 떼면 속도 0)
      const idle = performance.now() - swipe.lastT > 100;
      const speed = idle ? 0 : swipe.vx * -swipe.dir;
      const progress = swipe.dir > 0 ? flip.angle / 90 : 1 - flip.angle / 90;
      const commit = event.type !== 'touchcancel' &&
        (speed > 0.3 || (progress > 0.5 && speed > -0.3));
      settleFlip(commit);
    }
    swipe = null;
    isUserInteracting = false;
  }

  function onWheel(event) {
    event.preventDefault();
    fov += event.deltaY * 0.05;
    fov = Math.max(20, Math.min(100, fov));
    camera.fov = fov;
    camera.updateProjectionMatrix();
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    if (flip) cancelFlip();
  }

  function updateCamera() {
    lat = Math.max(-85, Math.min(85, lat));
    phi = THREE.MathUtils.degToRad(90 - lat);
    theta = THREE.MathUtils.degToRad(lon);

    // 카메라 위치를 구 내부에서 Y축으로 이동 (시점 높이 조절)
    camera.position.set(0, cameraHeight, 0);

    // 카메라 위치 기준으로 lookAt 타겟 계산
    const x = camera.position.x + 500 * Math.sin(phi) * Math.cos(theta);
    const y = camera.position.y + 500 * Math.cos(phi);
    const z = camera.position.z + 500 * Math.sin(phi) * Math.sin(theta);
    camera.lookAt(x, y, z);
  }

  function animate() {
    requestAnimationFrame(animate);
    // 넘김 중에는 종이(스냅샷)와 시점이 어긋나지 않도록 회전 정지
    if (autoRotate && !isUserInteracting && !flip) {
      lon += 0.05;
    }
    updateCamera();
    renderer.render(scene, camera);
  }

  function updateHeight(val) {
    cameraHeight = val;
    heightSlider.value = val;
    heightValue.textContent = val > 0 ? '+' + val : val;
  }

  // 드래그 & 드롭
  dropZone.addEventListener('click', () => fileInput.click());

  document.body.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('drag-over');
  });
  document.body.addEventListener('dragleave', (e) => {
    if (e.target === document.body) {
      dropZone.classList.remove('drag-over');
    }
  });
  document.body.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    handleFiles(e.dataTransfer.files);
  });

  fileInput.addEventListener('change', (e) => {
    handleFiles(e.target.files);
    e.target.value = ''; // 같은 파일을 다시 골라도 change가 발생하도록
  });

  // 컨트롤 버튼
  fullscreenBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  });

  resetBtn.addEventListener('click', () => {
    lon = 0; lat = 0; fov = 75;
    camera.fov = fov;
    camera.updateProjectionMatrix();
    updateHeight(0);
  });

  // 시점 높이 슬라이더
  heightSlider.addEventListener('input', (e) => {
    updateHeight(parseInt(e.target.value, 10));
  });

  heightReset.addEventListener('click', () => {
    updateHeight(0);
  });

  // 키보드 단축키
  window.addEventListener('keydown', (e) => {
    if (dropZone.style.display !== 'none') return; // 이미지 로드 전엔 비활성
    const step = e.shiftKey ? 20 : 5;
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      updateHeight(Math.min(200, cameraHeight + step));
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      updateHeight(Math.max(-200, cameraHeight - step));
    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      flipBy(1);
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      flipBy(-1);
    } else if (e.key === 'r' || e.key === 'R') {
      updateHeight(0);
    } else if (e.key === 'f' || e.key === 'F') {
      fullscreenBtn.click();
    }
  });

  autoRotateBtn.addEventListener('click', () => {
    autoRotate = !autoRotate;
    autoRotateBtn.textContent = autoRotate ? '회전 정지' : '자동 회전';
    autoRotateBtn.style.background = autoRotate
      ? 'rgba(255, 200, 80, 0.3)'
      : 'rgba(255, 255, 255, 0.08)';
  });

  init();
})();
</script>
</body>
</html>
