<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>이태량 AR 벽걸이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@300;400;600&family=Nanum+Myeongjo:wght@700;800&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }
  /* Layout: 흰 갤러리 벽. 위에 3D 캔버스, 아래에 작품 선택 줄. '배치하기'는 실제 치수의 벽 도면 편집기. 흰 갤러리 단일 테마. */
  :root {
    --white: #ffffff; --wall: #f3f3f1; --ink: #141414; --muted: #77776f; --faint: #b5b5ae; --rule: #e3e3de;
    --f-serif: 'Nanum Myeongjo', 'AppleMyungjo', 'Batang', serif;
    --f-sans: 'Gothic A1', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body { background: var(--white); color: var(--ink); font-family: var(--f-sans); overflow: hidden; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; }
  button:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }
  .app { height: 100%; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-inline: 20px; padding-block: calc(14px + env(safe-area-inset-top, 0px)) 10px; border-bottom: 1px solid var(--rule); }
  header .who { font-family: var(--f-serif); font-weight: 800; font-size: 18px; letter-spacing: -0.02em; }
  header .what { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }

  .stage { position: relative; flex: 1; min-height: 0; background: var(--wall); display: flex; flex-direction: column; }
  model-viewer { flex: 1; min-height: 0; width: 100%; --poster-color: transparent; --progress-bar-color: var(--ink); --progress-bar-height: 2px; }
  model-viewer::part(default-ar-button) { display: none; }
  .label { padding-inline: 20px; padding-block: 10px 14px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; border-top: 1px solid var(--rule); background: var(--white); }
  .label .t { display: grid; gap: 2px; min-width: 0; }
  .label .ko { font-family: var(--f-serif); font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
  .label .en { font-size: 11px; font-style: italic; color: var(--muted); }
  .label .meta { margin-top: 4px; font-size: 10.5px; line-height: 1.6; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ar-btn { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 10px; padding: 13px 18px; background: var(--ink); color: var(--white); border: 0; cursor: pointer; font-size: 13px; letter-spacing: .04em; white-space: nowrap; }
  .ar-btn svg { width: 16px; height: 16px; }
  .ar-btn[hidden] { display: none; }
  .note { position: absolute; top: 12px; left: 20px; right: 20px; font-size: 11px; line-height: 1.6; color: var(--muted); max-width: 32em; pointer-events: none; }
  .note b { font-weight: 600; color: var(--ink); }

  .rail { display: flex; gap: 8px; overflow-x: auto; padding-inline: 20px; padding-block: 12px calc(14px + env(safe-area-inset-bottom, 0px)); scrollbar-width: none; }
  .rail::-webkit-scrollbar { display: none; }
  .rail button { flex: 0 0 auto; width: 56px; height: 72px; padding: 0; border: 1px solid var(--rule); background: var(--white); cursor: pointer; display: grid; place-items: center; }
  .rail button img { width: 44px; height: 58px; object-fit: cover; display: block; opacity: .75; transition: opacity .15s; }
  .rail button[aria-pressed="true"] { border-color: var(--ink); }
  .rail button[aria-pressed="true"] img, .rail button:hover img { opacity: 1; }
  .modes { display: flex; gap: 0; border: 1px solid var(--rule); }
  .modes button { padding: 6px 10px; border: 0; background: var(--white); color: var(--muted); font-size: 11px; letter-spacing: .04em; cursor: pointer; }
  .modes button[aria-pressed="true"] { background: var(--ink); color: var(--white); }
  .rail.multi button[aria-pressed="false"] img { opacity: .28; }
  .ruler { display: flex; align-items: center; gap: 8px; padding-inline: 20px; padding-block: 0 8px; font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ruler i { display: block; height: 5px; border: 1px solid var(--muted); border-top: 0; }
  /* 전시 벽: 어떤 배치를 볼지 */
  .wallbar { display: flex; gap: 6px; overflow-x: auto; padding-inline: 20px; padding-block: 10px; border-bottom: 1px solid var(--rule); background: var(--white); scrollbar-width: none; }
  .wallbar::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; padding: 6px 11px; border: 1px solid var(--rule); background: var(--white); font-size: 11px; letter-spacing: .03em; cursor: pointer; white-space: nowrap; }
  .chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--white); }
  .chip.add { color: var(--muted); border-style: dashed; }

  /* ---------- 배치 편집기 ---------- */
  .editor { flex: 1; min-height: 0; overflow-y: auto; background: var(--white); display: flex; flex-direction: column; }
  .editor > * { flex-shrink: 0; }
  .ed-walls { display: grid; gap: 10px; padding-inline: 20px; padding-block: 12px 10px; border-bottom: 1px solid var(--rule); }
  .ed-walls .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .ed-size { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 11px; color: var(--muted); }
  .ed-size label { display: inline-flex; align-items: center; gap: 6px; }
  .ed-size input, .ed-info input { width: 68px; padding: 5px 6px; border: 1px solid var(--rule); font: inherit; font-size: 12px; color: var(--ink); font-variant-numeric: tabular-nums; background: var(--white); }
  .ed-size input:focus, .ed-info input:focus { outline: 1px solid var(--ink); border-color: var(--ink); }
  .text-btn { background: none; border: 0; padding: 4px 2px; font-size: 11px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .text-btn:hover { color: var(--ink); }
  .ed-canvas { background: var(--wall); padding-inline: 8px; padding-block: 10px; }
  #wall-svg { display: block; width: 100%; height: auto; touch-action: none; user-select: none; -webkit-user-select: none; }
  #wall-svg .item { cursor: grab; }
  #wall-svg .item:active { cursor: grabbing; }
  .ed-info { padding-inline: 20px; padding-block: 12px; border-bottom: 1px solid var(--rule); display: grid; gap: 8px; font-size: 11.5px; line-height: 1.6; color: var(--muted); min-height: 92px; }
  .ed-info b { color: var(--ink); font-weight: 600; }
  .ed-info .t { font-family: var(--f-serif); font-weight: 700; font-size: 15px; color: var(--ink); }
  .ed-info .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
  .ed-info .row label { display: inline-flex; align-items: center; gap: 6px; }
  .ed-info .warn { color: #a3401f; }
  .ed-info .tools { display: flex; flex-wrap: wrap; gap: 6px; }
  .ghost-btn { padding: 7px 11px; border: 1px solid var(--rule); background: var(--white); font-size: 11px; cursor: pointer; }
  .ghost-btn:hover { border-color: var(--ink); }
  .ed-tray-label { padding-inline: 20px; padding-block: 12px 0; font-size: 10px; letter-spacing: .12em; color: var(--muted); }
  .ed-tray { display: flex; gap: 8px; overflow-x: auto; padding-inline: 20px; padding-block: 8px 12px; scrollbar-width: none; }
  .ed-tray::-webkit-scrollbar { display: none; }
  .ed-tray button { position: relative; flex: 0 0 auto; width: 56px; height: 72px; padding: 0; border: 1px solid var(--rule); background: var(--white); cursor: pointer; display: grid; place-items: center; }
  .ed-tray button img { display: block; object-fit: cover; }
  .ed-tray button[data-state="here"] { border-color: var(--ink); }
  .ed-tray button[data-state="none"] img { opacity: .55; }
  .ed-tray button i { position: absolute; top: 3px; right: 3px; min-width: 15px; height: 15px; padding: 0 3px; font-style: normal; font-size: 9px; line-height: 15px; text-align: center; background: var(--ink); color: var(--white); }
  .ed-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-inline: 20px; padding-block: 4px 10px; }
  .ed-hint { padding-inline: 20px; padding-block: 0 calc(16px + env(safe-area-inset-bottom, 0px)); font-size: 10.5px; line-height: 1.6; color: var(--muted); word-break: keep-all; }
  .ed-hint code { font-size: 10px; word-break: break-all; color: var(--ink); }
  @media (max-width: 420px) { .label { flex-direction: column; align-items: stretch; } .ar-btn { justify-content: center; } }
  @media (prefers-reduced-motion: reduce) { .rail button img { transition: none; } }
</style>
</head>
<body>
<main class="app">
  <header>
    <span class="who">이태량</span>
    <nav class="modes" aria-label="보기 방식">
      <button type="button" id="mode-one" aria-pressed="true">한 점씩</button>
      <button type="button" id="mode-wall" aria-pressed="false">전시 벽</button>
      <button type="button" id="mode-edit" aria-pressed="false">배치하기</button>
    </nav>
  </header>
  <nav class="wallbar" id="wallbar" aria-label="어떤 배치를 볼지" hidden></nav>
  <div class="stage">
    <model-viewer id="mv" alt="캔버스 3D 모델" ar ar-modes="webxr scene-viewer quick-look" ar-placement="wall" ar-scale="fixed"
      camera-controls disable-pan camera-orbit="-12deg 85deg auto" min-camera-orbit="auto 60deg auto" max-camera-orbit="auto 100deg auto"
      shadow-intensity="0.6" shadow-softness="0.9" exposure="1.05" environment-image="neutral" interaction-prompt="none" loading="eager">
    </model-viewer>
    <p class="note" id="note"></p>
    <div class="label">
      <div class="t"><p class="ko" id="ko"></p><p class="en" id="en"></p><p class="meta" id="meta"></p></div>
      <button class="ar-btn" id="ar-btn" type="button" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 7V4h3M18 4h3v3M21 17v3h-3M6 20H3v-3"/><rect x="7" y="8" width="10" height="8"/></svg>
        <span id="ar-label">벽에 걸어보기</span>
      </button>
    </div>
  </div>
  <div class="ruler" id="ruler-row"><i id="ruler"></i><span>50 cm · 아래 그림들은 같은 축척</span></div>
  <nav class="rail" id="rail" aria-label="작품 선택"></nav>

  <section class="editor" id="editor" aria-label="배치 편집" hidden>
    <div class="ed-walls">
      <div class="chips" id="wall-chips"></div>
      <div class="ed-size">
        <label>벽 가로 <input id="wall-w" type="number" inputmode="numeric" min="100" max="3000" step="1"> cm</label>
        <label>높이 <input id="wall-h" type="number" inputmode="numeric" min="150" max="1000" step="1"> cm</label>
        <button class="text-btn" id="wall-del" type="button">이 벽 삭제</button>
      </div>
    </div>
    <div class="ed-canvas"><svg id="wall-svg" role="img" aria-label="벽 도면. 그림을 끌어 옮기세요."></svg></div>
    <div class="ed-info" id="ed-info" aria-live="polite"></div>
    <p class="ed-tray-label">작품 · 누르면 이 벽에 걸고, 걸린 그림은 선택됩니다</p>
    <div class="ed-tray" id="ed-tray"></div>
    <div class="ed-actions">
      <button class="ar-btn" id="ed-ar" type="button">이 벽을 AR로 보기</button>
      <button class="ghost-btn" id="ed-share" type="button">배치 링크 복사</button>
      <button class="text-btn" id="ed-reset" type="button">처음부터</button>
    </div>
    <p class="ed-hint" id="ed-hint"></p>
  </section>
</main>

<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<script>
(function () {
  const WORKS = [
    { id: 'w1', ko: '핑크가 있는 즉흥', en: 'Improvisation with pink', year: 2026, w: 65.1, h: 90.9, ho: '30호 P' },
    { id: 'w2', ko: '지워진 생각', en: 'Erased Thought', year: 2026, w: 65.1, h: 90.9, ho: '30호 P' },
    { id: 'w3', ko: '순간의 함몰', en: 'depression of the moment', year: 2026, w: 130.3, h: 162.2, ho: '100호 F' },
    { id: 'w4', ko: '인스턴트 꿈', en: 'Instant dream', year: 2026, w: 60.6, h: 72.7, ho: '20호 F' },
    { id: 'w5', ko: '검은 사실', en: 'Black facts', year: 2025, w: 72.7, h: 90.9, ho: '30호 F' },
    { id: 'w6', ko: '현존성', en: 'Presence', year: 2026, w: 72.7, h: 90.9, ho: '30호 F' },
    { id: 'w7', ko: '무엇에 따라서', en: 'According to What', year: 2026, w: 60.6, h: 72.7, ho: '20호 F' },
    { id: 'w8', ko: '자기정의', en: 'self-definition', year: 2025, w: 80.3, h: 116.8, ho: '50호 P' },
  ];
  const $ = (id) => document.getElementById(id);
  const mv = $('mv'), rail = $('rail'), note = $('note'), arBtn = $('ar-btn');
  arBtn.addEventListener('click', () => mv.activateAR());

  // 같은 축척 썸네일: 가장 큰 그림(162.2cm)이 58px
  const k = 58 / 162.2;
  $('ruler').style.width = (50 * k).toFixed(1) + 'px';
  WORKS.forEach((w, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('aria-label', w.ko);
    b.setAttribute('aria-pressed', 'false');
    b.innerHTML = `<img src="img/${w.id}.jpg" alt="" draggable="false" style="width:${(w.w * k).toFixed(1)}px;height:${(w.h * k).toFixed(1)}px">`;
    b.addEventListener('click', () => {
      if (mode === 'one') return select(i);
      if (wallView !== 'line') return;
      if (chosen.has(i) && chosen.size > 1) chosen.delete(i); else chosen.add(i);
      showWall();
    });
    rail.appendChild(b);
  });

  // ---------- 브라우저에서 GLB 만들기: 실제 치수의 캔버스, 모서리 라운드 + 천 짜임 ----------
  const DEPTH = 0.035;   // 캔버스 두께(m)
  const ROUND = 0.004;   // 모서리 라운드 반지름(m)
  // 아이폰 AR 변환이 텍스처를 1024px로 제한하므로, 1024px에 실 512가닥(2px 간격)이 낼 수 있는 가장 고운 짜임
  const WEAVE_PX = 1024, WEAVE_CELL = 2;
  const WEAVE_CM = 512 * 0.1;                      // 옆면 기준 한 장 = 51.2 cm (실 간격 1 mm)
  const glbCache = new Map(); // key → blob URL
  function pad4(n) { return (4 - n % 4) % 4; }

  // 한 면을 격자로 만든다. 모서리 근처만 촘촘히 나눠서 라운드가 매끈하게 꺾이도록
  function ticks(len) {
    const h = len / 2, r = Math.min(ROUND, h * 0.5);
    return [-h, -h + r * 0.35, -h + r * 0.7, -h + r, h - r, h - r * 0.7, h - r * 0.35, h];
  }
  function makeFace(center, u, v, normal, uLen, vLen, half, uvMode) {
    const tu = ticks(uLen), tv = ticks(vLen);
    const inner = half.map((x) => x - ROUND);
    const g = { pos: [], nor: [], uv: [], idx: [] };
    for (let j = 0; j < tv.length; j++) for (let i = 0; i < tu.length; i++) {
      const a = tu[i], b = tv[j];
      const p = [center[0] + u[0] * a + v[0] * b, center[1] + u[1] * a + v[1] * b, center[2] + u[2] * a + v[2] * b];
      // 둥근 상자: 안쪽 상자에 가장 가까운 점에서 ROUND만큼 밀어낸다
      const c = p.map((x, k) => Math.max(-inner[k], Math.min(inner[k], x)));
      let n = [p[0] - c[0], p[1] - c[1], p[2] - c[2]];
      const len = Math.hypot(...n);
      n = len < 1e-9 ? normal : n.map((x) => x / len);
      g.pos.push(c[0] + n[0] * ROUND, c[1] + n[1] * ROUND, c[2] + n[2] * ROUND);
      g.nor.push(...n);
      if (uvMode === 'image') g.uv.push(a / uLen + 0.5, 0.5 - b / vLen);
      else g.uv.push(a * 100 / WEAVE_CM, b * 100 / WEAVE_CM); // 타일 단위(cm 기준)로 짜임이 모든 면에서 같은 크기
    }
    const nu = tu.length;
    for (let j = 0; j < tv.length - 1; j++) for (let i = 0; i < nu - 1; i++) {
      const k = j * nu + i;
      g.idx.push(k, k + 1, k + nu + 1, k, k + nu + 1, k + nu);
    }
    return g;
  }
  function merge(faces) {
    const g = { pos: [], nor: [], uv: [], idx: [] };
    faces.forEach((f) => { const base = g.pos.length / 3; g.pos.push(...f.pos); g.nor.push(...f.nor); g.uv.push(...f.uv); g.idx.push(...f.idx.map((k) => k + base)); });
    return g;
  }

  // 천 짜임 노멀맵(평직): 날실·씨실이 번갈아 위로 올라오는 높이장을 만들어 법선으로 변환
  let weavePromise = null;
  function weaveNormalMap() {
    if (weavePromise) return weavePromise;
    weavePromise = (async () => {
      const S = WEAVE_PX, P = WEAVE_CELL, cv = document.createElement('canvas');
      cv.width = cv.height = S;
      const ctx = cv.getContext('2d'), img = ctx.createImageData(S, S);
      const h = new Float32Array(S * S);
      for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
        const fx = (x % P) / P, fy = (y % P) / P;
        const warpOnTop = ((Math.floor(x / P) + Math.floor(y / P)) % 2) === 0;
        const a = Math.sin(Math.PI * fx), b = Math.sin(Math.PI * fy);
        h[y * S + x] = warpOnTop ? a + 0.35 * b : b + 0.35 * a;
      }
      const at = (x, y) => h[((y + S) % S) * S + ((x + S) % S)];
      for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
        const dx = (at(x + 1, y) - at(x - 1, y)) * 0.9, dy = (at(x, y + 1) - at(x, y - 1)) * 0.9;
        const l = Math.hypot(dx, dy, 1), o = (y * S + x) * 4;
        img.data[o] = 128 + (-dx / l) * 127; img.data[o + 1] = 128 + (dy / l) * 127; img.data[o + 2] = 128 + (1 / l) * 127; img.data[o + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      const blob = await new Promise((r) => cv.toBlob(r, 'image/png'));
      return new Uint8Array(await blob.arrayBuffer());
    })();
    return weavePromise;
  }

  const imgCache = new Map();
  function imageBytes(id) {
    if (!imgCache.has(id)) imgCache.set(id, fetch(`img/${id}.jpg`).then((r) => r.arrayBuffer()).then((b) => new Uint8Array(b)));
    return imgCache.get(id);
  }

  // items: [{ w, x, y }] — 각 캔버스의 중심 위치(m). 한 점이면 [{ w, x: 0, y: 0 }]
  async function buildScene(items, key) {
    if (glbCache.has(key)) return glbCache.get(key);
    const weave = await weaveNormalMap();
    const imgs = await Promise.all(items.map((it) => imageBytes(it.w.id)));
    const chunks = [], views = [], accessors = [];
    let offset = 0;
    const addView = (bytes, target) => {
      const v = { buffer: 0, byteOffset: offset, byteLength: bytes.byteLength };
      if (target) v.target = target;
      views.push(v); chunks.push(bytes); offset += bytes.byteLength;
      const p = pad4(offset); if (p) { chunks.push(new Uint8Array(p)); offset += p; }
      return views.length - 1;
    };
    const addAcc = (arr, comp, type, count, target, bounds) => {
      const acc = { bufferView: addView(new Uint8Array(arr.buffer), target), componentType: comp, count, type };
      if (bounds) { acc.min = bounds[0]; acc.max = bounds[1]; }
      accessors.push(acc); return accessors.length - 1;
    };
    const prim = (g, material) => {
      const n = g.pos.length / 3;
      const mn = [Infinity, Infinity, Infinity], mx = [-Infinity, -Infinity, -Infinity];
      for (let i = 0; i < g.pos.length; i++) { const c = i % 3; mn[c] = Math.min(mn[c], g.pos[i]); mx[c] = Math.max(mx[c], g.pos[i]); }
      return { attributes: {
          POSITION: addAcc(new Float32Array(g.pos), 5126, 'VEC3', n, 34962, [mn, mx]),
          NORMAL: addAcc(new Float32Array(g.nor), 5126, 'VEC3', n, 34962),
          TEXCOORD_0: addAcc(new Float32Array(g.uv), 5126, 'VEC2', n, 34962) },
        indices: addAcc(new Uint16Array(g.idx), 5123, 'SCALAR', g.idx.length, 34963), material };
    };

      b.addEventListener('click', () => {
        const wl = layout.walls[edWall];
        if (state === 'here') { selId = w.id; renderSelection(); renderInfo(); return; }
        if (state === 'other') layout.walls[wi].items = layout.walls[wi].items.filter((t) => t.id !== w.id);
        // 오른쪽 끝 그림 옆 45 cm에, 자리가 없으면 벽 가운데에
        let x = wl.w / 2;
        if (wl.items.length) { const bb = bboxOf(wl.items); const nx = bb.R + 45 + w.w / 2; if (nx + w.w / 2 <= wl.w) x = nx; }
        const y = Math.min(wl.h - w.h / 2, Math.max(w.h / 2, EYE));
        wl.items.push({ id: w.id, x: r1(Math.min(wl.w - w.w / 2, Math.max(w.w / 2, x))), y: r1(y) });
        selId = w.id; renderEditor(); changed();
      });
      t.appendChild(b);
    });
  }
  function renderHint() {
    const h = $('ed-hint');
    const src = { example: '예시 배치로 시작했어요. 자유롭게 옮겨 보세요.', saved: '이 폰에 저장된 배치예요.', link: '받은 링크의 배치를 불러왔어요.', curated: '큐레이터가 정한 배치예요.' }[layoutSource];
    h.innerHTML = `${src} 바꾸는 즉시 이 폰에 저장됩니다. 관람객 모두가 이 배치를 보게 하려면 <b>배치 링크 복사</b> 후 그 링크를 나눠 주거나, Claude에게 보내 기본 배치로 고정하세요.<br>배치 코드 <code>${encodeLayout(layout)}</code>`;
  }
  function renderEditor() { renderWallChips(); renderWall(); renderInfo(); renderTray(); renderHint(); }
  function changed() { saveLayout(); if (layoutSource === 'example') layoutSource = 'saved'; renderWallChips(); renderTray(); renderInfo(); renderHint(); }

  const clampWall = (wl) => wl.items.forEach((it) => { const w = BY_ID[it.id]; it.x = r1(Math.min(wl.w - w.w / 2, Math.max(w.w / 2, it.x))); it.y = r1(Math.min(wl.h - w.h / 2, Math.max(w.h / 2, it.y))); });
  $('wall-w').addEventListener('change', (e) => { const wl = layout.walls[edWall]; wl.w = Math.min(3000, Math.max(100, Math.round(+e.target.value || wl.w))); clampWall(wl); renderEditor(); changed(); });
  $('wall-h').addEventListener('change', (e) => { const wl = layout.walls[edWall]; wl.h = Math.min(1000, Math.max(150, Math.round(+e.target.value || wl.h))); clampWall(wl); renderEditor(); changed(); });
  $('wall-del').addEventListener('click', () => { if (layout.walls.length < 2) return; layout.walls.splice(edWall, 1); edWall = Math.max(0, edWall - 1); selId = null; renderEditor(); changed(); });
  let resetArmed = false;
  $('ed-reset').addEventListener('click', (e) => {
    if (!resetArmed) { resetArmed = true; e.target.textContent = '한 번 더 누르면 비워집니다'; setTimeout(() => { resetArmed = false; e.target.textContent = '처음부터'; }, 3000); return; }
    resetArmed = false; e.target.textContent = '처음부터';
    layout = { walls: [{ w: 600, h: 280, items: [] }] }; edWall = 0; selId = null; renderEditor(); changed();
  });
  $('ed-share').addEventListener('click', async (e) => {
    const code = encodeLayout(layout);
    const inFrame = window.top !== window.self;
    const link = `${location.origin}${location.pathname}?layout=${code}#wall`;
    const text = inFrame ? code : link;
    const b = e.target;
    try { await navigator.clipboard.writeText(text); b.textContent = inFrame ? '배치 코드 복사됨' : '링크 복사됨'; }
    catch (err) { b.textContent = '아래 코드를 길게 눌러 복사하세요'; }
    setTimeout(() => { b.textContent = '배치 링크 복사'; }, 2500);
  });
  $('ed-ar').addEventListener('click', () => { if (!layout.walls[edWall].items.length) return; wallView = edWall; setMode('wall'); });

  // 내 배치 → AR 장면: 그림 묶음의 가운데가 원점(=AR에서 탭한 곳)
  function layoutScene(wl) {
    const bb = bboxOf(wl.items);
    return { items: wl.items.map((it) => ({ w: BY_ID[it.id], x: (it.x - bb.cx) / 100, y: (it.y - bb.cy) / 100 })), bb };
  }

  let mode = 'one', cur = -1, token = 0;
  const chosen = new Set(WORKS.map((_, i) => i)); // 전시 벽에 포함된 작품

  async function select(i) {
    if (mode === 'one' && i === cur) return;
    cur = i;
    const t = ++token;
    const w = WORKS[i];
    const url = await buildScene([{ w, x: 0, y: 0 }], w.id);
    if (t !== token) return;
    mv.src = url;
    mv.alt = `${w.ko}, ${w.w} × ${w.h} cm 캔버스`;
    $('ko').textContent = w.ko;
    $('en').textContent = w.en;
    $('meta').innerHTML = `${w.year} · oil on canvas<br><b>${w.h} × ${w.w} cm</b> · ${w.ho} · 두께 3.5 cm`;
    $('ar-label').textContent = '벽에 걸어보기';
    rail.querySelectorAll('button').forEach((b, j) => b.setAttribute('aria-pressed', String(j === i)));
    rail.children[i].scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
  }

  function renderWallbar() {
    const bar = $('wallbar'); bar.innerHTML = '';
    const opts = [['line', `일렬 · ${chosen.size}점`]];
    layout.walls.forEach((wl, i) => { if (wl.items.length) opts.push([i, `내 배치 ${wallName(i)} · ${wl.items.length}점`]); });
    if (wallView !== 'line' && !(layout.walls[wallView] && layout.walls[wallView].items.length)) wallView = 'line';
    opts.forEach(([v, label]) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.textContent = label; b.setAttribute('aria-pressed', String(v === wallView));
      b.addEventListener('click', () => { wallView = v; updateNote(); showWall(); });
      bar.appendChild(b);
    });
    const ed = document.createElement('button');
    ed.type = 'button'; ed.className = 'chip add'; ed.textContent = '배치 고치기';
    ed.addEventListener('click', () => { if (wallView !== 'line') edWall = wallView; setMode('edit'); });
    bar.appendChild(ed);
  }

  async function showWall() {
    renderWallbar();
    const custom = wallView !== 'line';
    $('rail').hidden = custom; $('ruler-row').hidden = custom;
    if (custom) {
      const t = ++token, wl = layout.walls[wallView];
      const { items, bb } = layoutScene(wl);
      const url = await buildScene(items, 'L:' + encodeLayout({ walls: [wl] }));
      if (t !== token) return;
      mv.src = url;
      mv.alt = `${wallName(wallView)}에 직접 배치한 작품 ${items.length}점, 가로 ${(bb.w / 100).toFixed(1)} m`;
      $('ko').textContent = `내 배치 ${wallName(wallView)} · ${items.length}점`;
      $('en').textContent = `벽 ${wl.w} × ${wl.h} cm`;
      $('meta').innerHTML = `그림 묶음 가로 <b>${(bb.w / 100).toFixed(2)} m</b> × 세로 <b>${(bb.h / 100).toFixed(2)} m</b><br>벽에서 왼쪽 끝으로부터 <b>${Math.round(bb.cx)} cm</b>, 바닥으로부터 <b>${Math.round(bb.cy)} cm</b> 지점을 탭하세요`;
      $('ar-label').textContent = '이 배치 세우기';
      return;
    }
    const t = ++token;
    const idx = [...chosen].sort((a, b) => a - b);
    const { items, width, height } = wallLayout(idx.map((i) => WORKS[i]));
    const url = await buildScene(items, 'wall:' + idx.join(','));
    if (t !== token) return;
    mv.src = url;
    mv.alt = `작품 ${idx.length}점을 한 벽에 건 전시, 가로 ${width.toFixed(1)} m`;
    $('ko').textContent = `전시 벽 · ${idx.length}점`;
    $('en').textContent = '작품을 눌러 빼거나 넣으세요';
    $('meta').innerHTML = `가로 <b>${width.toFixed(1)} m</b> · 가장 큰 그림 ${(height * 100).toFixed(0)} cm · 간격 ${GAP * 100} cm<br>그림 중심이 눈높이(약 150 cm)에 오도록 벽을 탭하세요`;
    $('ar-label').textContent = '전시 벽 세우기';
    rail.querySelectorAll('button').forEach((b, j) => b.setAttribute('aria-pressed', String(chosen.has(j))));
  }

  function setMode(m) {
    mode = m;
    ['one', 'wall', 'edit'].forEach((k) => $('mode-' + k).setAttribute('aria-pressed', String(m === k)));
    const editing = m === 'edit';
    document.querySelector('.stage').hidden = editing;
    $('editor').hidden = !editing;
    $('wallbar').hidden = m !== 'wall';
    $('rail').hidden = editing; $('ruler-row').hidden = editing;
    rail.classList.toggle('multi', m === 'wall');
    rail.setAttribute('aria-label', m === 'wall' ? '전시 벽에 넣을 작품 (여러 개 선택)' : '작품 선택');
    if (editing) { renderEditor(); return; }
    updateNote();
    if (m === 'wall') showWall();
    else { const i = cur < 0 ? 2 : cur; cur = -1; select(i); }
  }
  $('mode-one').addEventListener('click', () => mode !== 'one' && setMode('one'));
  $('mode-wall').addEventListener('click', () => mode !== 'wall' && setMode('wall'));
  $('mode-edit').addEventListener('click', () => mode !== 'edit' && setMode('edit'));

  // 이 기기에서 AR이 되는지에 따라 안내문
  function updateNote() {
    const inFrame = window.top !== window.self;
    arBtn.hidden = !(mv.canActivateAR && !inFrame);
    if (mv.canActivateAR && !inFrame) {
      note.innerHTML = mode === 'wall'
        ? (wallView === 'line'
          ? '<b>전시 벽 세우기</b>를 누르고 벽을 탭하면 고른 작품이 실제 크기와 간격으로 한 번에 걸립니다. 뒤로 물러나 벽 전체를 둘러보세요.'
          : '<b>이 배치 세우기</b>를 누르고 아래 적힌 기준점을 탭하면, 도면에서 정한 자리 그대로 걸립니다.')
        : '<b>벽에 걸어보기</b>를 누르고 카메라를 벽에 비추면 그림이 실제 크기로 걸립니다. 손가락으로 끌어 자리를 옮길 수 있어요.';
    } else if (inFrame) {
      note.innerHTML = '지금은 미리보기 화면 안이라 카메라 AR이 열리지 않습니다. 실제 사이트 주소(또는 QR)로 폰에서 열면 <b>벽에 걸어보기</b>가 작동합니다. 여기서는 드래그로 캔버스를 돌려 보세요.';
    } else {
      note.innerHTML = '이 기기는 AR을 지원하지 않습니다. 폰(iPhone 또는 Android)에서 열면 <b>벽에 걸어보기</b>가 나타납니다. 드래그로 캔버스를 돌려 보세요.';
    }
  }
  mv.addEventListener('load', updateNote);
  const hash = location.hash.replace('#', '');
  const fromHash = WORKS.findIndex((w) => w.id === hash);
  customElements.whenDefined('model-viewer').then(() => {
    if (hash === 'edit') return setMode('edit');
    if (hash === 'wall') {
      if (layoutSource === 'link' || layoutSource === 'curated') { const i = layout.walls.findIndex((wl) => wl.items.length); if (i >= 0) wallView = i; }
      return setMode('wall');
    }
    updateNote(); select(fromHash >= 0 ? fromHash : 2);
  });
})();
</script>
</body>
</html>
