<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0908">
<meta property="og:title" content="온기 : 불씨를 품다 — 국가무형유산 강령탈춤 2026년 정기공연">
<meta property="og:description" content="2026년 11월 14일(토) 오후 2시 · 민속극장 풍류">
<meta property="og:image" content="https://thehanfilm-code.github.io/panorama-viewer/onki-2026/img/acts/saja.jpg">
<title>온기 : 불씨를 품다</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@300;400;500;700;900&family=Nanum+Brush+Script&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }
  /* Layout: 어두운 무대. 첫 화면은 불씨가 피어오르며 탈과 제목이 켜지는 '막 오름',
     Continue 후에는 검은 무대 위 한 장짜리 책(흰 종이)을 모서리째 넘긴다.
     포스터의 빨강·주황·검정·남색을 그대로 쓰는 단일 다크 테마. */
  :root {
    --stage: #0b0908;
    --stage-2: #17110e;
    --paper: #fbf8f3;
    --ink: #121010;
    --muted: #776d66;
    --rule: #e6ded4;
    --red: #e3141f;
    --ember: #f26a21;
    --gold: #f6b23c;
    --navy: #2e3192;
    --blue: #0b72bb;
    --on-dark: #f3ece4;
    --on-dark-muted: #a99e94;
    --f-display: 'Black Han Sans', 'Noto Sans KR', sans-serif;
    --f-sans: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    --f-brush: 'Nanum Brush Script', 'Noto Sans KR', cursive;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--stage); color: var(--on-dark); font-family: var(--f-sans); overflow: hidden; -webkit-tap-highlight-color: transparent; }
  button, a { font: inherit; color: inherit; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  /* ---------- 막 오름 (첫 화면) ---------- */
  .opening { position: fixed; inset: 0; overflow-y: auto; overflow-x: hidden; background: radial-gradient(120% 70% at 50% 30%, #2a130b 0%, var(--stage-2) 38%, var(--stage) 72%); transition: opacity .7s ease; }
  .opening.leaving { opacity: 0; pointer-events: none; }
  #embers { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .op-inner { position: relative; max-width: 560px; margin: 0 auto; padding-inline: 20px; padding-block: calc(18px + env(safe-area-inset-top, 0px)) calc(36px + env(safe-area-inset-bottom, 0px)); display: grid; justify-items: center; text-align: center; gap: 0; }
  .op-top { width: 100%; display: flex; justify-content: space-between; font-size: 10px; letter-spacing: .24em; color: var(--on-dark-muted); text-transform: uppercase; }
  .mask-wrap { position: relative; width: min(76vw, 360px); margin-top: 18px; }
  .mask-wrap::before { content: ""; position: absolute; inset: 8% 6% 4%; border-radius: 50%; background: radial-gradient(circle, rgba(242,106,33,.55), rgba(227,20,31,.18) 45%, transparent 70%); filter: blur(18px); animation: breathe 4.8s ease-in-out infinite; }
  .mask-wrap img { position: relative; width: 100%; display: block; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22%); mask-image: linear-gradient(to bottom, transparent 0, #000 22%); }
  .logo { width: min(82vw, 400px); margin-top: 10px; filter: drop-shadow(0 0 10px rgba(242,106,33,.35)); }
  .band { width: calc(100% + 40px); margin-top: 18px; padding-block: 9px; background: #000; border-block: 1px solid #2a2320; font-size: 13px; font-weight: 700; letter-spacing: .02em; }
  .band span { color: var(--on-dark-muted); font-weight: 500; margin-left: 10px; }
  .title { margin-top: 22px; display: grid; justify-items: center; gap: 4px; }
  .title .onki { font-family: var(--f-display); color: var(--ember); font-size: 22px; letter-spacing: .02em; line-height: 1; }
  .title .onki small { font-family: var(--f-sans); font-weight: 900; font-size: 13px; margin-left: 6px; color: var(--gold); }
  .title h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(54px, 17vw, 92px); line-height: .98; letter-spacing: -0.01em; }
  .title h1 .fire { color: var(--red); text-shadow: 0 0 22px rgba(227,20,31,.55), 0 0 60px rgba(242,106,33,.35); }
  .title h1 .eul { font-size: .42em; vertical-align: .9em; margin-left: .04em; }
  .title h1 .pum { display: block; color: var(--on-dark); }
  .when { margin-top: 26px; display: grid; gap: 4px; }
  .when .date { font-family: var(--f-display); font-size: clamp(22px, 6.4vw, 30px); color: var(--gold); letter-spacing: .01em; }
  .when .venue { font-family: var(--f-display); font-size: clamp(30px, 9vw, 44px); color: var(--on-dark); line-height: 1.05; }
  .when .addr { font-size: 11px; color: var(--on-dark-muted); }
  .open-btn { margin-top: 26px; display: inline-flex; align-items: center; gap: 14px; padding: 16px 26px; border: 1px solid var(--ember); background: linear-gradient(180deg, #e3141f, #b30f17); color: #fff; font-size: 15px; font-weight: 700; letter-spacing: .03em; cursor: pointer; box-shadow: 0 0 0 0 rgba(242,106,33,.6); animation: pulse 2.6s ease-out infinite 2.4s; }
  .open-btn span { font-size: 11px; letter-spacing: .24em; text-transform: uppercase; opacity: .85; }
  .op-note { margin-top: 14px; font-size: 11px; color: var(--on-dark-muted); }

  /* 막 오름 연출: 순서대로 켜진다 */
  .rise { opacity: 0; transform: translateY(14px); animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
  .d1 { animation-delay: .15s } .d2 { animation-delay: .7s } .d3 { animation-delay: 1.15s } .d4 { animation-delay: 1.5s } .d5 { animation-delay: 1.9s } .d6 { animation-delay: 2.25s }
  .ignite { opacity: 0; filter: brightness(.2) blur(3px); animation: ignite 1.4s ease-out forwards .2s; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @keyframes ignite { 0% { opacity: 0; filter: brightness(.2) blur(4px); } 45% { opacity: 1; filter: brightness(1.5) blur(1px); } 100% { opacity: 1; filter: none; } }
  @keyframes breathe { 0%, 100% { opacity: .75; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(242,106,33,.55); } 70% { box-shadow: 0 0 0 16px rgba(242,106,33,0); } 100% { box-shadow: 0 0 0 0 rgba(242,106,33,0); } }

  /* ---------- 책 ---------- */
  .reader { position: fixed; inset: 0; display: flex; flex-direction: column; background: radial-gradient(90% 60% at 50% 45%, #1c1410 0%, var(--stage) 70%); }
  .reader-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-inline: 14px; padding-block: calc(8px + env(safe-area-inset-top, 0px)) 4px; font-size: 12px; }
  .reader-top .who { font-family: var(--f-display); font-size: 14px; letter-spacing: .01em; }
  .reader-top .who b { color: var(--red); font-weight: 400; }
  .reader-top nav { display: flex; gap: 2px; }
  .link-btn { background: none; border: 0; padding: 8px 10px; cursor: pointer; font-size: 12px; color: var(--on-dark-muted); }
  .link-btn:hover { color: var(--on-dark); }
  .stage { flex: 1; min-height: 0; display: grid; place-items: center; padding-inline: 10px; padding-block: 4px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  .book { position: relative; box-shadow: 0 0 0 1px rgba(255,255,255,.04), 0 30px 80px rgba(0,0,0,.65), 0 0 120px rgba(242,106,33,.10); background: var(--paper); }
  .slot { position: absolute; inset: 0; background: var(--paper); overflow: hidden; }
  #curl { position: absolute; pointer-events: none; }
  .reader-bottom { display: flex; align-items: center; justify-content: center; gap: 22px; padding-inline: 16px; padding-block: 4px calc(8px + env(safe-area-inset-bottom, 0px)); }
  .reader-bottom button { width: 36px; height: 36px; border: 1px solid #3a302a; background: #16110e; color: var(--on-dark); cursor: pointer; font-size: 17px; display: grid; place-items: center; }
  .reader-bottom button:disabled { opacity: .3; cursor: default; }
  .reader-bottom output { min-width: 96px; text-align: center; font-size: 11px; letter-spacing: .08em; color: var(--on-dark-muted); font-variant-numeric: tabular-nums; }

  /* ---------- 페이지 ---------- */
  .page { position: absolute; inset: 0; background: var(--paper); color: var(--ink); display: flex; flex-direction: column; padding: 26px 24px 16px; font-size: 12.5px; line-height: 1.8; }
  .page::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 22px; background: linear-gradient(to right, rgba(0,0,0,.08), transparent); pointer-events: none; }
  .run { display: flex; justify-content: space-between; font-size: 8.5px; letter-spacing: .14em; color: #a59a90; line-height: 1.4; }
  .run b { color: var(--red); font-weight: 700; }
  .folio { margin-top: auto; padding-top: 10px; text-align: center; font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: .1em; }
  .page h2 { font-family: var(--f-display); font-weight: 400; font-size: 23px; letter-spacing: -0.01em; line-height: 1.15; }
  .page h2 .fire { color: var(--red); }
  .page .eyebrow { font-size: 9px; letter-spacing: .22em; color: var(--ember); font-weight: 700; margin-bottom: 4px; line-height: 1.4; }
  .page .head { margin-top: 22px; }
  .page .src { margin-top: 10px; font-size: 9.5px; line-height: 1.5; color: #a59a90; }
  img { -webkit-user-drag: none; }

  /* 표지: 종이 위에 검은 무대를 한 판 깔고 그 위에 탈 */
  .cover { padding: 0; background: #0c0a09; color: var(--on-dark); }
  .cover::after { background: linear-gradient(to right, rgba(0,0,0,.35), transparent); }
  .cover .glow { position: absolute; inset: 0; background: radial-gradient(70% 45% at 50% 30%, rgba(242,106,33,.35), rgba(227,20,31,.12) 45%, transparent 70%); }
  .cover .inner { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 8% 8% 6%; }
  .cover .cmask { width: 92%; margin-top: -6%; }
  .cover .cmask img { width: 100%; display: block; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 24%); mask-image: linear-gradient(to bottom, transparent 0, #000 24%); }
  .cover .clogo { width: 88%; margin-top: 3%; }
  .cover .cband { width: calc(100% + 16%); margin-top: 4%; padding-block: 6px; background: #000; font-size: 10.5px; font-weight: 700; }
  .cover .ctitle { margin-top: 9%; font-family: var(--f-display); line-height: 1; }
  .cover .ctitle .onki { color: var(--ember); font-size: 17px; display: block; margin-bottom: 6px; }
  .cover .ctitle .big { font-size: clamp(40px, 13vw, 60px); }
  .cover .ctitle .fire { color: var(--red); text-shadow: 0 0 18px rgba(227,20,31,.5); }
  .cover .ctitle .eul { font-size: .45em; vertical-align: .8em; }
  .cover .cfoot { margin-top: auto; font-size: 11px; color: var(--on-dark-muted); line-height: 1.7; }
  .cover .cfoot b { color: var(--gold); font-family: var(--f-display); font-weight: 400; font-size: 15px; letter-spacing: .02em; }

  .contents ol { list-style: none; margin-top: 16px; display: grid; border-top: 2px solid var(--ink); }
  .contents li button { width: 100%; display: grid; grid-template-columns: 26px 1fr auto; align-items: baseline; gap: 10px; padding: 11px 0; border: 0; border-bottom: 1px solid var(--rule); background: none; text-align: left; cursor: pointer; }
  .contents .n { font-family: var(--f-display); font-size: 13px; color: var(--red); }
  .contents .t { min-width: 0; font-weight: 700; font-size: 13px; line-height: 1.4; }
  .contents .t small { display: block; font-weight: 400; font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .contents .p { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .greeting .lede { margin-top: 16px; font-size: 13px; line-height: 1.95; font-weight: 400; word-break: keep-all; display: grid; gap: 12px; }
  .greeting .lede .q { font-family: var(--f-display); font-weight: 400; font-size: 18px; line-height: 1.45; color: var(--red); padding-block: 10px; border-block: 1px solid var(--rule); text-align: center; }
  .greeting .sign { margin-top: 14px; text-align: right; font-size: 11px; color: var(--muted); }
  .greeting .sign b { color: var(--ink); font-weight: 700; }

  .info dl { margin-top: 16px; display: grid; border-top: 2px solid var(--ink); }
  .info dl div { display: grid; grid-template-columns: 46px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--rule); font-size: 12.5px; line-height: 1.65; }
  .info dt { color: var(--muted); font-size: 11px; padding-top: 1px; }
  .info dd { word-break: keep-all; }
  .info .bigdate { font-family: var(--f-display); font-size: 17px; color: var(--navy); line-height: 1.3; }
  .info .bigvenue { font-family: var(--f-display); font-size: 17px; color: var(--blue); line-height: 1.3; }

  .about .lede { margin-top: 14px; word-break: keep-all; display: grid; gap: 10px; }
  .about .facts { margin-top: 14px; display: grid; border-top: 2px solid var(--ink); }
  .about .facts div { display: grid; grid-template-columns: 58px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--rule); line-height: 1.6; }
  .about .facts dt { color: var(--muted); font-size: 11px; padding-top: 1px; }
  .acts ol { margin-top: 14px; list-style: none; display: grid; border-top: 2px solid var(--ink); counter-reset: act; }
  .acts li { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .acts li .no { font-family: var(--f-display); font-size: 12px; color: var(--red); white-space: nowrap; }
  .acts li b { font-size: 14px; font-weight: 700; }
  .acts .note { margin-top: 12px; font-size: 11px; line-height: 1.7; color: var(--muted); word-break: keep-all; }
  .credits dl { margin-top: 16px; display: grid; gap: 0; border-top: 2px solid var(--ink); }
  .credits dl div { display: grid; grid-template-columns: 86px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: 12.5px; line-height: 1.6; }
  .credits dt { color: var(--muted); font-size: 11px; padding-top: 1px; }
  .credits dd { font-weight: 500; word-break: keep-all; }

  .map .place { margin-top: 16px; font-family: var(--f-display); font-size: 19px; color: var(--blue); line-height: 1.2; }
  .map .addr { margin-top: 8px; font-size: 12.5px; line-height: 1.7; word-break: keep-all; }
  .map .pin { margin-top: 18px; flex: 1; min-height: 0; border: 1px solid var(--rule); background:
      repeating-linear-gradient(0deg, transparent 0 23px, #eee7dd 23px 24px), repeating-linear-gradient(90deg, transparent 0 23px, #eee7dd 23px 24px), #f6f1ea;
      display: grid; place-items: center; position: relative; }
  .map .pin i { width: 18px; height: 18px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--red); box-shadow: 0 0 0 6px rgba(227,20,31,.15); }
  .map .pin span { position: absolute; bottom: 10px; font-size: 10px; color: var(--muted); }
  .map .btns { margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .map .btns a { display: block; text-align: center; padding: 11px 8px; border: 1px solid var(--ink); text-decoration: none; font-size: 12px; font-weight: 700; color: var(--ink); }
  .map .btns a.solid { background: var(--ink); color: var(--paper); }

  .share { padding: 0; background: #0c0a09; color: var(--on-dark); }
  .share::after { background: linear-gradient(to right, rgba(0,0,0,.35), transparent); }
  .share .inner { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 8%; gap: 12px; }
  .share .glow { position: absolute; inset: 0; background: radial-gradient(60% 40% at 50% 42%, rgba(242,106,33,.22), transparent 70%); }
  .share .qrbox { position: relative; background: #fff; padding: 12px; width: 52%; }
  .share .qrbox svg { display: block; width: 100%; height: auto; }
  .share h3 { position: relative; font-family: var(--f-display); font-weight: 400; font-size: 20px; }
  .share h3 .fire { color: var(--red); }
  .share p { position: relative; font-size: 11.5px; line-height: 1.7; color: var(--on-dark-muted); word-break: keep-all; }
  .share .url { font-size: 10px; color: var(--on-dark); word-break: break-all; }
  .share .acts { position: relative; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 4px; }
  .share .acts button { padding: 10px 14px; border: 1px solid #3a302a; background: #16110e; color: var(--on-dark); cursor: pointer; font-size: 11.5px; }
  .share .acts button.solid { border-color: var(--red); background: var(--red); color: #fff; }
  .share .slogo { position: relative; width: 62%; margin-top: 6px; opacity: .9; }


  /* ---------- 흐르는 페이지(과장 · 단체 소개): 넘치면 다음 쪽으로 ---------- */
  .flow .photo { margin-top: 14px; }
  .flow .photo img { display: block; width: 100%; height: auto; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,.12); }
  .flow .emblem { margin-top: 16px; display: grid; place-items: center; }
  .flow .emblem img { width: 46%; display: block; }
  .flow .ttl { margin-top: 14px; display: flex; align-items: baseline; gap: 8px; }
  .flow .ttl .no { font-family: var(--f-display); font-size: 12px; color: var(--red); }
  .flow .ttl h2 { font-size: 22px; }
  .flow .ttl.cont h2 { font-size: 15px; color: var(--muted); }
  .flow .body { margin-top: 10px; display: grid; gap: 9px; word-break: keep-all; }
  .flow .body h4 { margin-top: 4px; font-size: 12.5px; font-weight: 700; color: var(--red); }
  .flow .cast { margin-top: 4px; padding: 10px 12px; background: #f1ebe2; border-radius: 10px; display: grid; gap: 4px; font-size: 12px; line-height: 1.6; }
  .flow .cast div { display: grid; grid-template-columns: 74px 1fr; gap: 8px; }
  .flow .cast dt { color: var(--muted); font-size: 11px; padding-top: 1px; }
  .flow .cast dd { font-weight: 500; }
  .flow .note { font-size: 11px; color: var(--muted); }

  /* 오늘의 과장 */
  .program ol { margin-top: 14px; list-style: none; display: grid; border-top: 2px solid var(--ink); }
  .program li button { width: 100%; display: grid; grid-template-columns: 44px 52px 1fr auto; align-items: center; gap: 10px; padding: 7px 0; border: 0; border-bottom: 1px solid var(--rule); background: none; text-align: left; cursor: pointer; }
  .program li .no { font-family: var(--f-display); font-size: 11px; color: var(--red); }
  .program li img { width: 52px; height: 36px; object-fit: contain; background: #141110; border-radius: 6px; display: block; }
  .program li b { font-size: 13px; font-weight: 700; }
  .program li .p { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .program .music { margin-top: 14px; padding: 10px 12px; background: #f1ebe2; border-radius: 10px; }
  .program .music p { font-size: 10px; letter-spacing: .18em; color: var(--ember); font-weight: 700; }
  .program .music dl { margin-top: 4px; display: grid; gap: 2px; font-size: 12px; }
  .program .music dl div { display: grid; grid-template-columns: 40px 1fr; gap: 8px; }
  .program .music dt { color: var(--muted); font-size: 11px; }

  .contents.compact li button { padding: 7px 0; }
  .contents.compact2 .t small { display: none; }
  .contents.compact2 li button { padding: 8px 0; }
  .program.compact li button { padding: 4px 0; gap: 8px; }
  .program.compact li img { width: 44px; height: 30px; }
  .program.compact .music { margin-top: 10px; padding: 8px 10px; }
  .program.compact2 li img { display: none; }
  .program.compact2 li button { grid-template-columns: 44px 1fr auto; }
  .page h2.cont-h { font-size: 15px; color: var(--muted); }
  .page h2.cont-h small { font-family: var(--f-sans); font-size: 11px; font-weight: 500; }
  .flow .emblem img { aspect-ratio: 1400 / 1099; }
  .contents.compact3 .head { margin-top: 12px; }
  .contents.compact3 ol { margin-top: 10px; }
  .contents.compact3 li button { padding: 5px 0; }
  .contents.compact3 .t { font-size: 12px; }
  .rotate { display: none; }
  @media (orientation: landscape) and (max-height: 520px) {
    .reader .rotate { display: grid; place-items: center; align-content: center; gap: 6px; position: absolute; inset: 0; z-index: 5; background: var(--stage); text-align: center; }
    .reader .rotate p { font-family: var(--f-display); font-size: 22px; }
    .reader .rotate b { color: var(--red); font-weight: 400; }
    .reader .rotate small { font-size: 12px; color: var(--on-dark-muted); }
  }
  /* 출연진: 한 쪽에 6명 */
  .cast-page .grid { margin-top: 14px; flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px 10px; align-content: space-evenly; }
  .cast-page figure { display: grid; gap: 5px; align-content: start; }
  .cast-page figure img { width: 100%; aspect-ratio: 587 / 767; object-fit: cover; border-radius: 10px; display: block; box-shadow: 0 1px 4px rgba(0,0,0,.12); }

        <p>휴대폰 카메라로 QR을 찍으면<br>이 프로그램북이 열립니다.</p>
        <div class="acts">
          <button type="button" class="solid" data-copy>링크 복사</button>
          <button type="button" data-goto="0">처음으로</button>
          <button type="button" data-intro>막 오름 다시 보기</button>
        </div>
        <img class="slogo" src="img/logo-dark.png" alt="" draggable="false"></div></section>`), '함께 보기', 'share');

    // 오늘의 과장 + 악사 (작은 화면에서 넘치면 악사를 다음 쪽으로)
    const progAt = M.findIndex((m) => m.key === 'program');
    const band = `<div class="music"><p>악사 MUSICIANS</p><dl>${MUSIC.map(([r, n]) => `<div><dt>${r}</dt><dd>${n}</dd></div>`).join('')}</dl></div>`;
    const progPage = (withBand, shift) => el(`<section class="page program" aria-label="오늘의 과장">${run()}
      <div class="head"><p class="eyebrow">PROGRAM</p><h2>오늘의 과장</h2></div>
      <ol>${SECTIONS.map((s, i) => `<li><button type="button" data-goto="${actStart[s.key] + shift}"><span class="no">제${i + 1}과장</span><img src="${s.img}" alt="" draggable="false"><b>${s.title}</b><span class="p">${actStart[s.key] + shift}</span></button></li>`).join('')}</ol>
      ${withBand ? band : ''}<p class="folio">00</p></section>`);
    let prog = progPage(true, 0);
    if (!fit(prog, ['compact', 'compact2'])) {
      // 악사를 따로 한 쪽으로: 그 뒤 쪽 번호가 하나씩 밀린다
      const shift = 1;
      prog = progPage(false, shift); fit(prog, ['compact', 'compact2']);
      P.splice(progAt + 1, 0, el(`<section class="page program" aria-label="악사">${run()}
        <div class="head"><p class="eyebrow">MUSICIANS</p><h2>악사</h2></div>${band}<p class="folio">00</p></section>`));
      M.splice(progAt + 1, 0, { label: '악사', key: 'music' });
      for (const k in actStart) actStart[k] += shift;
    }
    P[progAt] = prog;
    // 목차
    const at = (k) => M.findIndex((m) => m.key === k);
    const toc = [['인사말', '온기 : 불씨를 품다', at('greet0')], ['공연 안내', '일시 · 장소 · 주최 · 주관', at('info0')], ['강령탈춤연구회', '단체 소개', at('group0')],
                 ['강령탈춤이란', '국가무형유산', at('about')], ['출연진', `${PEOPLE.length}명`, at('cast1')], ['오늘의 과장', `${SECTIONS.length}과장 · 악사`, progAt],
                 ['제작진', '총감독 · 연출 · 기획 · 무대', at('staff0')], ['오시는 길', '민속극장 풍류', at('map')], ['함께 보기', 'QR · 링크 공유', at('share')]];
    const tocPage = el(`<section class="page contents" aria-label="목차">${run()}
      <div class="head"><p class="eyebrow">CONTENTS</p><h2>목차</h2></div>
      <ol>${toc.map(([t, sub, i], k) => `<li><button type="button" data-goto="${i}"><span class="n">${String(k + 1).padStart(2, '0')}</span><span class="t">${t}<small>${sub}</small></span><span class="p">${i}</span></button></li>`).join('')}</ol>
      <p class="folio">00</p></section>`);
    fit(tocPage, ['compact', 'compact2', 'compact3']);
    P[1] = tocPage;
    P.forEach((p, i) => { const f = p.querySelector('.folio'); if (f) f.textContent = i; });
    measure.replaceChildren();
    return { P, M };
  }

  function paginate() {
    const keep = meta[cur] ? meta[cur].key : 'cover';
    measure.style.width = W + 'px'; measure.style.height = H + 'px'; measure.style.position = 'fixed';
    const r = buildPages();
    pages = r.P; meta = r.M; N = pages.length;
    const i = meta.findIndex((m) => m.key === keep);
    cur = i >= 0 ? i : Math.min(cur, N - 1);
  }

  // ---------- 상태 · 크기 ----------
  let cur = 0, W = 0, H = 0, flip = null, drag = null;
  const M_CANVAS = 60; // 그림자용 여백

  function layout() {
    const availW = stage.clientWidth - 20;
    const availH = stage.clientHeight - 8;
    // 휴대폰에서는 화면 높이를 거의 다 쓰는 세로로 긴 종이(최대 1:1.9), 넓은 화면에서는 폭 520px
    let w = Math.min(availW, 520);
    let h = Math.min(availH, w * 1.9);
    if (h < w * 1.3) w = h / 1.3;
    const nW = Math.round(w), nH = Math.round(h), changed = nW !== W || nH !== H;
    W = nW; H = nH;
    book.style.width = W + 'px';
    book.style.height = H + 'px';
    const dpr = window.devicePixelRatio || 1;
    const cw = 2 * W + 2 * M_CANVAS, ch = H + 2 * M_CANVAS;
    curl.style.left = -(W + M_CANVAS) + 'px';
    curl.style.top = -M_CANVAS + 'px';
    curl.style.width = cw + 'px';
    curl.style.height = ch + 'px';
    curl.width = Math.round(cw * dpr);
    curl.height = Math.round(ch * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, (W + M_CANVAS) * dpr, M_CANVAS * dpr);
    if (changed || !pages.length) paginate();
  }

  function rest() {
    top.replaceChildren(pages[cur]);
    top.style.clipPath = 'none';
    under.replaceChildren();
    ctx.clearRect(-W - M_CANVAS, -M_CANVAS, curl.width, curl.height);
    prevBtn.disabled = cur === 0;
    nextBtn.disabled = cur === N - 1;
    counter.textContent = meta[cur].label;
  }

  async function copyLink(btn) {
    const old = btn.textContent;
    try { await navigator.clipboard.writeText(BOOK_URL); btn.textContent = '복사됨'; }
    catch (e) { btn.textContent = '주소를 길게 눌러 복사하세요'; }
    setTimeout(() => { btn.textContent = old; }, 2200);
  }

  // ---------- 종이 접힘 기하 ----------
  // 모서리 C를 손가락 P까지 끌어오면, 접는 선은 C와 P의 수직이등분선
  function clipHalf(poly, m, n, keepFold) {
    const out = [];
    const side = (p) => ((p[0] - m[0]) * n[0] + (p[1] - m[1]) * n[1]) * (keepFold ? 1 : -1);
    for (let i = 0; i < poly.length; i++) {
      const a = poly[i], b = poly[(i + 1) % poly.length];
      const da = side(a), db = side(b);
      if (da >= 0) out.push(a);
      if ((da >= 0) !== (db >= 0)) {
        const t = da / (da - db);
        out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
      }
    }
    return out;
  }

  // 책등(왼쪽 모서리)에 붙어 있으므로 종이가 찢어지지 않는 범위로 제한
  function constrain(p, cy) {
    const s1 = [0, cy], s2 = [0, H - cy];
    const lim = (q, s, r) => {
      const dx = q[0] - s[0], dy = q[1] - s[1], d = Math.hypot(dx, dy);
      return d > r ? [s[0] + dx * r / d, s[1] + dy * r / d] : q;
    };
    p = lim(p, s1, W);
    return lim(p, s2, Math.hypot(W, H));
  }

  function path(poly) {
    ctx.beginPath();
    poly.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
    ctx.closePath();
  }

  function draw() {
    const C = flip.corner, P = flip.p;
    ctx.clearRect(-W - M_CANVAS, -M_CANVAS, curl.width, curl.height);
    const dx = C[0] - P[0], dy = C[1] - P[1], d = Math.hypot(dx, dy);
    if (d < 0.5) { top.style.clipPath = 'none'; return; }
    const n = [dx / d, dy / d];
    const m = [(C[0] + P[0]) / 2, (C[1] + P[1]) / 2];
    const rect = [[0, 0], [W, 0], [W, H], [0, H]];
    const front = clipHalf(rect, m, n, false);
    const fold = clipHalf(rect, m, n, true);
    top.style.clipPath = front.length >= 3
      ? 'polygon(' + front.map((p) => p[0].toFixed(1) + 'px ' + p[1].toFixed(1) + 'px').join(',') + ')'
      : 'polygon(0 0, 0 0, 0 0)';
    if (fold.length < 3) return;
    const reflect = (p) => {
      const k = 2 * ((p[0] - m[0]) * n[0] + (p[1] - m[1]) * n[1]);
      return [p[0] - k * n[0], p[1] - k * n[1]];
    };
    const flap = fold.map(reflect);
    const progress = Math.min(1, d / (2 * W));
    const strength = Math.sin(Math.min(1, progress * 1.15) * Math.PI) * 0.75 + 0.25;

    // 1) 드러난 아래 페이지에 지는 그림자 (접힌 선 → 모서리 방향)
    ctx.save();
    path(fold);
    ctx.clip();
    const sl = Math.min(d / 2, 70);
    let g = ctx.createLinearGradient(m[0], m[1], m[0] + n[0] * sl, m[1] + n[1] * sl);
    g.addColorStop(0, `rgba(0,0,0,${0.30 * strength})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(-W - M_CANVAS, -M_CANVAS, 2 * W + 2 * M_CANVAS, H + 2 * M_CANVAS);
    ctx.restore();

    // 2) 넘어오는 종이의 뒷면 (흰 종이) + 앞 페이지에 드리우는 그림자
    ctx.save();
    path(flap);
    ctx.shadowColor = `rgba(0,0,0,${0.22 * strength})`;
    ctx.shadowBlur = 26;
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.restore();
    const far = [m[0] - n[0] * d / 2, m[1] - n[1] * d / 2];
    g = ctx.createLinearGradient(m[0], m[1], far[0], far[1]);
    g.addColorStop(0, 'rgba(0,0,0,0.12)');
    g.addColorStop(0.10, 'rgba(0,0,0,0.03)');
    g.addColorStop(0.35, 'rgba(255,255,255,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.06)');
    path(flap);
    ctx.fillStyle = g;
    ctx.fill();
    // 접힌 모서리의 가는 선
    ctx.strokeStyle = 'rgba(0,0,0,0.06)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // dir +1: 지금 장을 넘김, -1: 왼쪽에 넘어가 있던 이전 장을 되돌림
  function begin(dir, yInPage) {
    const target = cur + dir;
    if (flip || target < 0 || target >= N) return false;
    const cy = yInPage > H / 2 ? H : 0;
    const corner = [W, cy];
    if (dir > 0) { top.replaceChildren(pages[cur]); under.replaceChildren(pages[target]); }
    else { top.replaceChildren(pages[target]); under.replaceChildren(pages[cur]); }
    flip = { dir, target, corner, cy, p: dir > 0 ? corner.slice() : [-W, cy], settling: false };
    draw();
    return true;
  }

  function settle(commit, arc) {
    const f = flip;
    const forward = f.dir > 0;
    const to = commit === forward ? [-W, f.cy] : f.corner.slice();
    const from = f.p.slice();
    const dist = Math.hypot(to[0] - from[0], to[1] - from[1]);
    const duration = reduceMotion ? 1 : 180 + 520 * dist / (2 * W);
    const lift = arc ? (f.cy > 0 ? -1 : 1) * H * 0.16 : 0;
    const t0 = performance.now();
    f.settling = true;
    function step(now) {
      if (flip !== f) return;
      const t = Math.min(1, (now - t0) / duration);
      const e = arc ? (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2) : 1 - Math.pow(1 - t, 3);
      const p = [from[0] + (to[0] - from[0]) * e, from[1] + (to[1] - from[1]) * e + lift * Math.sin(Math.PI * e)];
      f.p = constrain(p, f.cy);
      draw();
      if (t < 1) requestAnimationFrame(step);
      else { if (commit) cur = f.target; flip = null; rest(); }
    }
    requestAnimationFrame(step);
  }

  function turn(dir) {
    if (begin(dir, H * 0.75)) settle(true, true);
  }

  function goTo(i) {
    if (flip || i === cur || i < 0 || i >= N) return;
    if (Math.abs(i - cur) === 1) return turn(i - cur);
    cur = i;
    rest();
  }

  // ---------- 입력 ----------
  stage.addEventListener('pointerdown', (e) => {
    if (flip || (e.pointerType === 'mouse' && e.button !== 0)) return;
    const r = book.getBoundingClientRect();
    drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, py: e.clientY - r.top, t0: performance.now(),
             mode: 'pending', lastX: e.clientX, lastT: performance.now(), vx: 0 };
    stage.setPointerCapture(e.pointerId);
  });

  stage.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if (drag.mode === 'pending') {
      if (Math.hypot(dx, dy) < 8) return;
      const dir = dx < 0 ? 1 : -1;
      drag.mode = Math.abs(dx) > Math.abs(dy) && begin(dir, drag.py) ? 'flip' : 'none';
    }
    if (drag.mode !== 'flip') return;
    const now = performance.now(), dt = now - drag.lastT;
    if (dt > 0) drag.vx = 0.6 * ((e.clientX - drag.lastX) / dt) + 0.4 * drag.vx;
    drag.lastX = e.clientX;
    drag.lastT = now;
    const c = flip.corner;
    const p = flip.dir > 0 ? [c[0] + dx * 1.5, c[1] + dy * 0.5] : [-W + dx * 2, c[1] + dy * 0.5];
    flip.p = constrain(p, flip.cy);
    draw();
  });

  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag;
    drag = null;
    if (d.mode === 'flip' && flip && !flip.settling) {
      const idle = performance.now() - d.lastT > 100;
      const speed = idle ? 0 : d.vx * -flip.dir; // 넘기는 방향 속도 px/ms
      const done = flip.dir > 0 ? (W - flip.p[0]) / (2 * W) : (flip.p[0] + W) / (2 * W);
      settle(e.type !== 'pointercancel' && (speed > 0.3 || (done > 0.3 && speed > -0.3)), false);
      return;
    }
    if (d.mode === 'pending' && e.type === 'pointerup' && performance.now() - d.t0 < 400) {
      const hit = document.elementFromPoint(e.clientX, e.clientY);
      const go = hit && hit.closest('[data-goto]');
      if (go) return goTo(Number(go.dataset.goto));
      if (hit && hit.closest('[data-intro]')) return showIntro();
      if (hit && hit.closest('[data-copy]')) return copyLink(hit.closest('[data-copy]'));
      if (hit && hit.closest('[data-link]')) return; // 링크는 브라우저가 처리
      const r = book.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width;
      if (x > 0.7) turn(1);
      else if (x < 0.3) turn(-1);
    }
  }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);

  // 키보드로 페이지 안 버튼 누르기
  book.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const go = e.target.closest('[data-goto]');
    if (go) { e.preventDefault(); goTo(Number(go.dataset.goto)); }
    else if (e.target.closest('[data-intro]')) { e.preventDefault(); showIntro(); }
  });

  prevBtn.addEventListener('click', () => turn(-1));
  nextBtn.addEventListener('click', () => turn(1));
  $('to-contents').addEventListener('click', () => goTo(1));
  $('to-intro').addEventListener('click', showIntro);

  window.addEventListener('keydown', (e) => {
    if (reader.hidden) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); turn(1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); turn(-1); }
    else if (e.key === 'Home') goTo(0);
    else if (e.key === 'End') goTo(N - 1);
  });
  window.addEventListener('resize', () => {
    if (reader.hidden) return;
    flip = null;
    layout();
    rest();
  });


  // ---------- 막 오름 ↔ 책 ----------
  // 출연진 사진은 미리 받아 둔다(책장을 넘길 때 빈 칸이 보이지 않게)
  function preloadPeople() { PEOPLE.forEach((p) => { const im = new Image(); im.decoding = 'async'; im.src = 'img/' + p.img; }); }
  async function showReader() {
    reader.hidden = false;
    preloadPeople();
    try { await document.fonts.ready; } catch (e) {}
    layout();
    rest();
    intro.classList.add('leaving');
    setTimeout(() => { intro.hidden = true; embers.stop(); }, reduceMotion ? 0 : 700);
  }
  function showIntro() {
    flip = null;
    intro.hidden = false;
    intro.scrollTop = 0;
    // 막 오름 연출을 다시 재생
    intro.querySelectorAll('.rise, .ignite').forEach((n) => { n.style.animation = 'none'; void n.offsetWidth; n.style.animation = ''; });
    requestAnimationFrame(() => intro.classList.remove('leaving'));
    reader.hidden = true;
    embers.start();
  }
  $('continue').addEventListener('click', showReader);

  // ---------- 불씨 (떠오르는 불티) ----------
  const embers = (() => {
    const cv = $('embers'), c = cv.getContext('2d');
    let parts = [], raf = 0, w = 0, h = 0, dpr = 1, last = 0;
    function size() {
      dpr = Math.min(2, window.devicePixelRatio || 1);
      w = cv.clientWidth; h = cv.clientHeight;
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function spawn(initial) {
      const hot = Math.random() < 0.25;
      return { x: Math.random() * w, y: initial ? Math.random() * h : h + 10, r: hot ? 1.2 + Math.random() * 1.6 : 0.6 + Math.random() * 1.1,
               vy: 18 + Math.random() * 46, sway: 8 + Math.random() * 22, ph: Math.random() * 6.28, life: 0, max: 4 + Math.random() * 6, hot };
    }
    function frame(t) {
      const dt = Math.min(0.05, (t - (last || t)) / 1000); last = t;
      c.clearRect(0, 0, w, h);
      c.globalCompositeOperation = 'lighter';
      for (const p of parts) {
        p.life += dt; p.y -= p.vy * dt; p.x += Math.sin(p.ph + p.life * 1.6) * p.sway * dt;
        const k = Math.max(0, 1 - p.life / p.max) * Math.min(1, p.life * 2);
        const g = c.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 6);
        g.addColorStop(0, p.hot ? `rgba(255,214,140,${0.95 * k})` : `rgba(255,150,70,${0.8 * k})`);
        g.addColorStop(0.35, `rgba(242,106,33,${0.45 * k})`);
        g.addColorStop(1, 'rgba(227,20,31,0)');
        c.fillStyle = g; c.beginPath(); c.arc(p.x, p.y, p.r * 6, 0, 6.283); c.fill();
      }
      parts = parts.map((p) => (p.life > p.max || p.y < -20 ? spawn(false) : p));
      raf = requestAnimationFrame(frame);
    }
    return {
      start() {
        if (reduceMotion || raf) return;
        size(); last = 0;
        const n = Math.round(Math.min(70, Math.max(28, w * h / 9000)));
        parts = Array.from({ length: n }, () => spawn(true));
        raf = requestAnimationFrame(frame);
      },
      stop() { cancelAnimationFrame(raf); raf = 0; c.clearRect(0, 0, w, h); },
      resize() { if (raf) size(); },
    };
  })();
  window.addEventListener('resize', () => embers.resize());
  embers.start();
})();
</script>
</body>
</html>
